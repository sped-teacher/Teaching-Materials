<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>作業限時鐘</title>
  <meta name="description" content="資源班作業限時鐘：看得見的時間、先做再玩、提早完成集星星">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 淺色（平板近看）為預設；深色適合投影 */
    :root {
      --bg: #F6F1E7; --card: #FFFFFF; --ink: #2A2825; --muted: #6E675D; --line: #E4DCCD; --soft: #FBF8F2;
      --time: #2E8B6E; --time-soft: #E2F3E8; --warn: #D98A1F; --track: #ECE5D6;
      --btn: #2E8B6E; --btn-ink: #FFFFFF; --star: #E8A92A;
      --font: 'Noto Sans TC', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
    }
    :root[data-theme="dark"] {
      --bg: #15161A; --card: #1F2126; --ink: #F5EBD4; --muted: #A9A294; --line: #33363D; --soft: #262930;
      --time: #F2C14E; --time-soft: #3A3322; --warn: #F29E4C; --track: #2E3138;
      --btn: #F2C14E; --btn-ink: #15161A; --star: #F2C14E;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; transition: background .2s; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    :focus-visible { outline: 3px solid var(--time); outline-offset: 2px; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 28px; display: grid; gap: 16px; }
    .top { display: flex; align-items: center; gap: 10px; }
    .top h1 { margin: 0; font-size: 24px; flex: 1; }
    .top a { color: var(--muted); text-decoration: none; font-size: 16px; }
    .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 20px; display: grid; place-items: center; }
    .icon-btn[aria-pressed="false"] { opacity: .5; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    .main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }

    /* 先…再… */
    .ft { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .ft label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
    .ft input { width: 100%; min-height: 54px; border: 2px solid var(--line); border-radius: 14px; background: var(--soft); padding: 8px 12px; font-size: 20px; font-weight: 700; }
    .ft .arrow { font-size: 28px; color: var(--muted); padding-top: 20px; }

    /* 時間圓盤＋數字 */
    .clock { display: grid; place-items: center; padding: 10px 0 4px; }
    .dial { position: relative; width: min(72vw, 440px); aspect-ratio: 1; container-type: inline-size; }
    .dial svg { width: 100%; height: 100%; display: block; }
    .dial .digits {
      position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900;
      font-size: min(12vw, 84px); font-size: 18cqw; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .dial.nodisc { aspect-ratio: auto; width: 100%; }
    .dial.nodisc .digits { position: static; font-size: clamp(80px, 22vw, 240px); padding: 20px 0; }
    .dial.nodigits .digits { display: none; }
    .status { margin-top: 8px; font-size: 22px; font-weight: 700; color: var(--muted); min-height: 1.5em; text-align: center; }
    .status.run { color: var(--time); }
    .status.warn { color: var(--warn); }

    .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .big { min-height: 64px; min-width: 150px; padding: 10px 26px; border-radius: 18px; border: 2px solid transparent; font-size: 24px; font-weight: 900; }
    .big.go { background: var(--btn); color: var(--btn-ink); }
    .big.ghost { background: var(--card); border-color: var(--line); }
    .big.done { background: var(--time-soft); border-color: var(--time); color: var(--ink); }
    .big:disabled { opacity: .45; }

    /* 設定時間 */
    .side h2 { font-size: 18px; margin: 0 0 10px; }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .presets button { min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--soft); font-size: 19px; font-weight: 700; }
    .presets button.on { border-color: var(--time); background: var(--time-soft); }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
    .stepper button { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--line); background: var(--soft); font-size: 30px; font-weight: 700; }
    .stepper .val { min-width: 120px; text-align: center; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stepper .val small { font-size: 17px; font-weight: 500; color: var(--muted); }
    .opts { margin-top: 14px; display: grid; gap: 4px; }
    .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 17px; }
    .switch { width: 58px; height: 34px; border-radius: 99px; border: none; background: #BDB5A6; position: relative; flex: none; }
    .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch[aria-checked="true"] { background: var(--time); }
    .switch[aria-checked="true"]::after { left: 28px; }

    .stars { margin-top: 14px; }
    .stars .row { display: flex; flex-wrap: wrap; gap: 4px; font-size: 30px; color: var(--star); min-height: 40px; }
    .stars .note { font-size: 16px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .link-btn { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 4px; }

    /* 時間到／完成的提示 */
    .overlay { position: fixed; inset: 0; background: rgba(20, 16, 10, .55); display: grid; place-items: center; padding: 16px; z-index: 20; }
    .overlay[hidden] { display: none; }
    .modal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 28px 22px; width: min(520px, 100%); text-align: center; }
    .modal .em { font-size: 72px; line-height: 1.1; }
    .modal h2 { font-size: 32px; margin: 10px 0 6px; }
    .modal p { font-size: 20px; color: var(--muted); margin: 0 0 18px; }
    .modal .then { font-size: 22px; font-weight: 700; color: var(--time); margin-bottom: 18px; }

    /* 全螢幕／上課模式：只留時間 */
    body.focus .side, body.focus .ft-card, body.focus .top h1, body.focus .top a { display: none; }
    body.focus .main { grid-template-columns: 1fr; }
    body.focus .dial { width: min(80vh, 88vw); }
    body.focus .task-show { display: block; }
    .task-show { display: none; text-align: center; font-size: clamp(22px, 4vw, 40px); font-weight: 900; margin-bottom: 4px; }
    .task-show small { display: block; font-size: .55em; font-weight: 500; color: var(--muted); }

    @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .ft { grid-template-columns: 1fr; } .ft .arrow { display: none; } .big { min-width: 120px; font-size: 21px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>⏳ 作業限時鐘</h1>
      <a href="../../#tools">🏫 總覽</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切換淺色／深色">🌙</button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="聲音" aria-pressed="true">🔔</button>
      <button class="icon-btn" id="focusBtn" type="button" aria-label="上課模式（只顯示時間）">⛶</button>
    </div>

    <div class="card ft-card">
      <div class="ft">
        <div><label for="task">現在要做</label><input id="task" type="text" placeholder="例如：數學習作第 3 頁" autocomplete="off"></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div><label for="reward">做完可以（可不填）</label><input id="reward" type="text" placeholder="例如：看一本喜歡的書" autocomplete="off"></div>
      </div>
    </div>

    <div class="main">
      <div class="card">
        <div class="task-show" id="taskShow"></div>
        <div class="clock">
          <div class="dial" id="dial">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <circle cx="100" cy="100" r="92" fill="var(--track)"/>
              <path id="pie" fill="var(--time)"/>
              <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="2"/>
              <circle id="hole" cx="100" cy="100" r="62" fill="var(--card)"/>
            </svg>
            <div class="digits" id="digits" role="timer" aria-live="off">05:00</div>
          </div>
          <div class="status" id="status" aria-live="polite">準備好了</div>
        </div>
        <div class="controls">
          <button class="big go" id="startBtn" type="button">▶ 開始</button>
          <button class="big ghost" id="resetBtn" type="button">↺ 重來</button>
          <button class="big done" id="doneBtn" type="button" disabled>🎉 我做完了</button>
        </div>
      </div>

      <div class="card side">
        <h2>要多久？</h2>
        <div class="presets" id="presets"></div>
        <div class="stepper" aria-label="微調時間">
          <button type="button" id="minus" aria-label="少 1 分鐘">−</button>
          <div class="val" id="setVal">5 <small>分鐘</small></div>
          <button type="button" id="plus" aria-label="多 1 分鐘">＋</button>
        </div>
        <div class="opts">
          <div class="opt"><span>時間圓盤</span><button class="switch" id="optDisc" role="switch" aria-checked="true" type="button"></button></div>
          <div class="opt"><span>顯示數字</span><button class="switch" id="optDigits" role="switch" aria-checked="true" type="button"></button></div>
          <div class="opt"><span>剩 1 分鐘語音提醒</span><button class="switch" id="optWarn" role="switch" aria-checked="true" type="button"></button></div>
        </div>
        <div class="stars">
          <h2>今天完成的作業</h2>
          <div class="row" id="starRow" aria-live="polite"></div>
          <div class="note"><span id="starNote">還沒有，加油！</span><button class="link-btn" id="clearStars" type="button">重新計算</button></div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="em" id="mEm">🔔</div>
      <h2 id="mTitle">時間到</h2>
      <p id="mText">停下來，看看做到哪裡了。</p>
      <div class="then" id="mThen"></div>
      <button class="big go" id="mOk" type="button">好</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    var KEY = 'classtool-homework-v1';
    var PRESETS = [1, 3, 5, 10, 15, 20];
    var $ = function (id) { return document.getElementById(id); };

    // ── 設定與今天的星星（只存在這台裝置）──
    var st = { theme: 'light', sound: true, disc: true, digits: true, warn: true, minutes: 5, task: '', reward: '', day: '', stars: 0 };
    try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { }
    var today = new Date().toDateString();
    if (st.day !== today) { st.day = today; st.stars = 0; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }

    // ── 計時（用結束時間計算，切到背景回來也準）──
    var total = st.minutes * 60, left = total, endAt = 0, timer = null, warned = false, running = false, wakeLock = null;

    function fmt(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
    function piePath(frac) {
      if (frac >= 0.9999) return 'M100 8 A92 92 0 1 1 99.99 8 Z';
      if (frac <= 0) return '';
      var a = frac * 2 * Math.PI, x = 100 + 92 * Math.sin(a), y = 100 - 92 * Math.cos(a);
      return 'M100 100 L100 8 A92 92 0 ' + (frac > 0.5 ? 1 : 0) + ' 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Z';
    }
    function draw() {
      var frac = total ? left / total : 0;
      $('pie').setAttribute('d', piePath(frac));
      var warnNow = running && left <= 60 && total > 60;
      $('pie').setAttribute('fill', warnNow ? 'var(--warn)' : 'var(--time)');
      $('digits').textContent = fmt(left);
      $('digits').style.color = warnNow ? 'var(--warn)' : '';
    }
    function status(text, cls) { var s = $('status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }

    function tick() {
      left = (endAt - Date.now()) / 1000;
      if (st.warn && !warned && left <= 60 && total > 90) { warned = true; chime([660], 0.3); say('還有一分鐘'); status('還有 1 分鐘', 'warn'); }
      if (left <= 0) { left = 0; draw(); finish(false); return; }
      draw();
    }
    function start() {
      if (running) { pause(); return; }
      if (left <= 0) left = total;
      running = true; endAt = Date.now() + left * 1000;
      timer = setInterval(tick, 200); tick();
      $('startBtn').textContent = '⏸ 暫停'; $('doneBtn').disabled = false;
      status(left <= 60 && total > 60 ? '還有 1 分鐘' : '專心做……', left <= 60 && total > 60 ? 'warn' : 'run');
      lockScreen(true); unlockAudio();
    }
    function pause() {
      running = false; clearInterval(timer); left = Math.max(0, (endAt - Date.now()) / 1000);
      $('startBtn').textContent = '▶ 繼續'; status('暫停中'); draw(); lockScreen(false);
    }
    function reset() {
      running = false; clearInterval(timer); total = st.minutes * 60; left = total; warned = false;
      $('startBtn').textContent = '▶ 開始'; $('doneBtn').disabled = true; status('準備好了'); draw(); lockScreen(false);
    }
    function finish(early) {
      running = false; clearInterval(timer); lockScreen(false);
      $('startBtn').textContent = '▶ 開始'; $('doneBtn').disabled = true;
      if (early) {
        st.stars++; save(); renderStars();
        chime([523, 659, 784, 1047], 0.25, 0.12);
        showModal('🌟', '提早完成！', '你在時間內做完了，得到一顆星星。', st.reward);
        say('太棒了，你提早完成了');
      } else {
        chime([784, 659, 523], 0.5, 0.35);
        showModal('🔔', '時間到', '停下來，看看做到哪裡了。', '');
        say('時間到，停下來看看做到哪裡了');
      }
      status(early ? '完成了！' : '時間到');
    }
    function showModal(em, title, text, reward) {
      $('mEm').textContent = em; $('mTitle').textContent = title; $('mText').textContent = text;
      $('mThen').textContent = reward ? '現在可以：' + reward : '';
      $('overlay').hidden = false; $('mOk').focus();
    }
    $('mOk').addEventListener('click', function () { $('overlay').hidden = true; reset(); });

    // ── 聲音：柔和的鈴聲＋中文語音 ──
    var actx = null;
    function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { } }
    function chime(freqs, dur, gap) {
      if (!st.sound) return;
      try {
        unlockAudio(); var t = actx.currentTime;
        freqs.forEach(function (f) {
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
          o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.7); t += (gap || 0.15);
        });
      } catch (e) { }
    }
    function say(text) {
      if (!st.sound || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = 0.9;
      var v = speechSynthesis.getVoices().find(function (x) { return /zh[-_]TW/i.test(x.lang); }); if (v) u.voice = v;
      setTimeout(function () { speechSynthesis.speak(u); }, 400);
    }

    // ── 螢幕保持亮著（支援的瀏覽器）──
    function lockScreen(on) {
      if (!('wakeLock' in navigator)) return;
      if (on && !wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () { });
      if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && running) lockScreen(true); });

    // ── 設定時間 ──
    function setMinutes(m) {
      st.minutes = Math.min(90, Math.max(1, m)); save();
      $('setVal').innerHTML = st.minutes + ' <small>分鐘</small>';
      [].forEach.call($('presets').children, function (b) { b.classList.toggle('on', +b.dataset.m === st.minutes); });
      if (!running) reset();
    }
    PRESETS.forEach(function (m) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.m = m; b.textContent = m + ' 分';
      b.addEventListener('click', function () { setMinutes(m); });
      $('presets').appendChild(b);
    });
    $('minus').addEventListener('click', function () { setMinutes(st.minutes - 1); });
    $('plus').addEventListener('click', function () { setMinutes(st.minutes + 1); });

    // ── 開關 ──
    function bindSwitch(id, key, after) {
      var b = $(id);
      var sync = function () { b.setAttribute('aria-checked', st[key] ? 'true' : 'false'); if (after) after(); };
      b.addEventListener('click', function () { st[key] = !st[key]; save(); sync(); });
      sync();
    }
    function applyView() {
      $('dial').classList.toggle('nodisc', !st.disc);
      $('dial').classList.toggle('nodigits', !st.digits && st.disc);
      document.querySelector('.dial svg').style.display = st.disc ? '' : 'none';
    }
    bindSwitch('optDisc', 'disc', applyView);
    bindSwitch('optDigits', 'digits', applyView);
    bindSwitch('optWarn', 'warn');

    function applyTheme() {
      document.documentElement.dataset.theme = st.theme;
      $('themeBtn').textContent = st.theme === 'dark' ? '☀️' : '🌙';
    }
    $('themeBtn').addEventListener('click', function () { st.theme = st.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); });
    $('soundBtn').addEventListener('click', function () { st.sound = !st.sound; save(); this.setAttribute('aria-pressed', st.sound ? 'true' : 'false'); if (st.sound) chime([660], 0.2); });
    $('soundBtn').setAttribute('aria-pressed', st.sound ? 'true' : 'false');
    $('focusBtn').addEventListener('click', function () {
      document.body.classList.toggle('focus');
      var el = document.documentElement;
      if (document.body.classList.contains('focus') && el.requestFullscreen) el.requestFullscreen().catch(function () { });
      else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    });

    // ── 先…再… ──
    function syncTask() {
      var t = $('task').value.trim(), r = $('reward').value.trim();
      st.task = t; st.reward = r; save();
      $('taskShow').innerHTML = '';
      if (t) { $('taskShow').textContent = t; if (r) { var s = document.createElement('small'); s.textContent = '做完可以：' + r; $('taskShow').appendChild(s); } }
    }
    $('task').value = st.task; $('reward').value = st.reward;
    $('task').addEventListener('input', syncTask); $('reward').addEventListener('input', syncTask);

    // ── 星星 ──
    function renderStars() {
      var row = $('starRow'); row.innerHTML = '';
      for (var i = 0; i < st.stars; i++) { var s = document.createElement('span'); s.textContent = '⭐'; row.appendChild(s); }
      $('starNote').textContent = st.stars ? '今天提早完成 ' + st.stars + ' 次' : '還沒有，加油！';
    }
    $('clearStars').addEventListener('click', function () { if (confirm('要把今天的星星重新計算嗎？')) { st.stars = 0; save(); renderStars(); } });

    $('startBtn').addEventListener('click', start);
    $('resetBtn').addEventListener('click', reset);
    $('doneBtn').addEventListener('click', function () { if (running || left < total) finish(true); });
    document.addEventListener('keydown', function (e) { if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); start(); } });

    applyTheme(); applyView(); setMinutes(st.minutes); syncTask(); renderStars(); reset();
  })();
  </script>
</body>
</html>

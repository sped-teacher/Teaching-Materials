<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>資源班教材總覽</title>
  <meta name="description" content="資源班教材與教室工具總覽">
  <meta name="theme-color" content="#F6F1E7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F1E7; --card: #FFFFFF; --ink: #2A2825; --muted: #6E675D; --line: #E4DCCD; --soft: #FBF8F2;
      --mandarin: #2F6DB0; --shadow: 0 2px 10px rgba(60, 45, 20, .08);
      --font: 'Noto Sans TC', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; -webkit-text-size-adjust: 100%; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 16px 40px; }
    header h1 { margin: 0; font-size: 32px; line-height: 1.3; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
    section { margin-top: 30px; }
    section h2 { font-size: 21px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .item {
      display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c, var(--mandarin));
      border-radius: 18px; box-shadow: var(--shadow); padding: 18px; min-height: 120px;
      transition: transform .08s ease;
    }
    .item:active { transform: scale(.98); }
    .item .t { font-size: 22px; font-weight: 700; }
    .item .d { font-size: 17px; color: var(--muted); }
    .item .meta { margin-top: auto; font-size: 15px; color: var(--c, var(--mandarin)); font-weight: 500; }
    .sub { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .sub a { font-size: 16px; color: var(--mandarin); text-decoration: none; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
    footer { text-align: center; color: var(--muted); font-size: 15px; line-height: 1.8; padding: 24px 16px 40px; border-top: 1px solid var(--line); margin-top: 32px; }
    :focus-visible { outline: 3px solid var(--mandarin); outline-offset: 2px; }
    @media (max-width: 640px) { header h1 { font-size: 27px; } main { padding-top: 22px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🏫 資源班教材總覽</h1>
      <p>教材與教室工具</p>
    </header>

    <section aria-labelledby="sec-mandarin">
      <h2 id="sec-mandarin">📚 國語</h2>
      <div class="grid">
        <a class="item" href="mandarin/">
          <span class="t">國語五上學習樂園</span>
          <span class="d">康軒版五上・生字、語詞、句型、閱讀理解、形近字、成語、注音聽打、課文點讀</span>
          <span class="meta">第 1～12 課 →</span>
        </a>
      </div>
      <div class="sub"><a href="mandarin/guide.html">📘 使用說明</a></div>
    </section>
  </main>

  <footer>
    資源班教材站・以 GitHub Pages 發布<br>
    特殊教育輔助教材，非出版社官方產品；僅供教學使用，不作商業用途。
  </footer>
</body>
</html>
